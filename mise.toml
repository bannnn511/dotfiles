[tools]
atuin = "latest"
bat = "latest"
delta = "latest"
eza = "latest"
fzf = "latest"
go = "latest"
helix = "latest"
neovim = "latest"
node = "latest"
starship = "latest"
zoxide = "latest"

[bootstrap.packages]
"apt:curl" = "latest"
"apt:fish" = "latest"
"apt:git" = "latest"
"apt:openssh-server" = "latest"
"apt:xauth" = "latest"
"brew:fish" = { version = "latest", os = "macos" }
"brew:git" = { version = "latest", os = "macos" }

[dotfiles]
"~" = { source = "home", mode = "symlink-each", manifest = "git" }
"~/.config/mise/config.toml" = { source = "mise.toml", mode = "symlink" }
